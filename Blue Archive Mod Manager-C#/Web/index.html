<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Blue Archive Mod Loader</title>
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-toggle-btn" title="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </div>
    
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">Blue Archive Mod Loader</h1>
            <div class="app-version">1.0.4</div>
        </header>

        <div class="content-grid">
            <div class="card game-info-card">
                <div class="card-header">
                    <h2>Game Info</h2>
                </div>
                <div class="card-content">
                    <div class="info-item">
                        <label>Game Executable Path</label>
                        <div class="path-display" id="game-path"></div>
                    </div>
                    <div class="info-item">
                        <label>Game Bundle Path</label>
                        <div class="path-display" id="game-bundle-path"></div>
                    </div>
                    <div class="status-section">
                        <p id="status-message"></p>
                        <button id="set-game-path-btn" class="btn btn-secondary">Set Game Path</button>
                    </div>
                </div>
            </div>

            <div class="card mod-management-card">
                <div class="card-header">
                    <h2>Mod Management</h2>
                    <div class="header-actions">
                        <button id="select-file-btn" class="btn btn-primary">Select File</button>
                        <button id="select-all-btn" class="btn btn-success">Select All</button>
                    </div>
                </div>
                <div class="card-content">
                    <div class="table-container">
                        <table id="mod-table" class="mod-table">
                            <thead>
                                <tr>
                                    <th class="col-checkbox">Enabled</th>
                                    <th class="col-filename" data-sortable="fileName">Filename</th>
                                    <th class="col-character" data-sortable="character">Character</th>
                                    <th class="col-modname" data-sortable="modName">Mod Name</th>
                                    <th class="col-date" data-sortable="installedDate">Date</th>
                                    <th class="col-actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="mod-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-panel">
            <div class="action-buttons">
                <button id="apply-mods-btn" class="btn btn-primary btn-large">
                    <span class="btn-icon">⚡</span>
                    <span class="btn-text">Apply Mods</span>
                </button>
                <button id="uninstall-mods-btn" class="btn btn-danger btn-large">
                    <span class="btn-icon">🗑️</span>
                    <span class="btn-text">Uninstall Mods</span>
                </button>
                <button id="launch-game-btn" class="btn btn-success btn-large">
                    <span class="btn-icon">🚀</span>
                    <span class="btn-text">Launch Game</span>
                </button>
            </div>
            <div class="status-display">
                <p id="action-status"></p>
            </div>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>
</html>
