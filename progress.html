<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .title { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 20px;
            text-align: center;
        }
        .progress-container {
            width: 100%;
            max-width: 300px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: width 0.3s ease;
            width: 0%;
        }
        .status-text {
            font-size: 14px;
            opacity: 0.9;
            text-align: center;
            margin-bottom: 10px;
        }
        .percent-text {
            font-size: 16px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="title">🎓 Blue Archive Mod Loader</div>
    <div class="status-text" id="status">正在初始化...</div>
    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>
    <div class="percent-text" id="percent">0%</div>
    
    <script>
        // API for updating progress from main process
        function updateProgress(status, percent) {
            const statusEl = document.getElementById('status');
            const progressEl = document.getElementById('progress');
            const percentEl = document.getElementById('percent');
            
            if (statusEl) statusEl.textContent = status;
            if (progressEl) progressEl.style.width = Math.round(percent) + '%';
            if (percentEl) percentEl.textContent = Math.round(percent) + '%';
        }
        
        // Make it globally available
        window.updateProgress = updateProgress;
    </script>
</body>
</html>
